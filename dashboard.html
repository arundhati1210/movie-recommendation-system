<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Movie Recommender</title>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <h1 class="title">Welcome, {{ session['username'] }}!</h1>
    <a href="{{ url_for('recommendations') }}" class="btn">View Recommendations</a>
    <a href="{{ url_for('logout') }}" class="btn logout">Logout</a>

    <div class="movie-grid">
      {% for movie in movies %}
        <div class="movie-card">
          <img src="{{ url_for('static', filename='images/posters/' + movie.poster_filename) }}" alt="{{ movie.title }} Poster" class="poster">
          <h2>{{ movie.title }}</h2>
          <p>{{ movie.description }}</p>
          <p><strong>Year:</strong> {{ movie.release_year }} | <strong>Genre:</strong> {{ movie.genre.name }}</p>

          <form action="{{ url_for('rate_movie', movie_id=movie.id) }}" method="POST" class="rating-form">
            <label for="score-{{ movie.id }}">Rate this movie:</label>
            <select name="score" id="score-{{ movie.id }}">
              {% for s in range(1, 6) %}
                <option value="{{ s }}" {% if ratings.get(movie.id) == s %}selected{% endif %}>{{ s }}</option>
              {% endfor %}
            </select>
            <button type="submit">Submit</button>
          </form>

          {% if movie.id in ratings %}
            <p class="rated">Your rating: {{ ratings[movie.id] }}/5</p>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
